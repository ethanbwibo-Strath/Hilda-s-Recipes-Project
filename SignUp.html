<!DOCTYPE html>
<html>
    <head> 
         
        <meta charset = "UTF-8">
        <link rel = "icon" href="Images/Hilda's Recipes.png" type = "image/png">
        <title>Sign Up Page</title>  
        <link rel="stylesheet" href="Login.css">
    </head>

    <body>

        
        <div id="logo">
            <a href="HomePage.php">
            <img src="Images/Hilda's Recipes.png" alt="Logo">
            </a>
        </div>
    
        
        <div class ="Form" id = SignUp>
            <h1>Hilda's Recipes</h1>
            <h2 class="SignUp_Title">Sign Up</h2>
            <p>Sign up to save and review your favorite recipes.</p>

            <form action="SignUp_action_page.php" method="post">
                <div id = "formDetails">
                
                <input type="text" id="username" name="username" required placeholder="Username">
                <br>

                <input type="email" id="email" name="email" required placeholder="Email">
                <br>
                
                <input type="password" id="password" name="password" required placeholder="Password">
                <br>
                <span id="password-strength-msg" style="font-size: 13px; color: red;"></span>
                <br>

                <button class = "button" type="submit" id="signup-button">Sign Up</button>

                <p>Already have an account? <a href="Login.html">Log in</a></p>
                <p class="SignUp_Home">Back to <a href="HomePage.php">Home</a></p>
                </div>

                <p>By signing up, you agree to our <a href="#Terms of Service">Terms of Service</a> and <a href="#Privacy Policy">Privacy Policy</a>.</p>

            </form>
        </div>
        


<script>
        // Get the elements
        const passwordInput = document.getElementById('password');
        const strengthMsg = document.getElementById('password-strength-msg');
        const signupButton = document.getElementById('signup-button');

        // Function to check strength
        const checkStrength = () => {
            let pass = passwordInput.value;
            let errors = [];

            // Rule 1: Length
            if (pass.length < 8) {
                errors.push("at least 8 characters");
            }
            // Rule 2: Uppercase
            if (!/[A-Z]/.test(pass)) {
                errors.push("one uppercase letter");
            }
            // Rule 3: Lowercase
            if (!/[a-z]/.test(pass)) {
                errors.push("one lowercase letter");
            }
            // Rule 4: Number
            if (!/\d/.test(pass)) {
                errors.push("one number");
            }

            // Show/hide messages
            if (errors.length > 0 && pass.length > 0) {
                strengthMsg.textContent = 'Must include: ' + errors.join(', ') + '.';
                signupButton.disabled = true; // Disable button
            } else {
                strengthMsg.textContent = ''; // Clear message
                signupButton.disabled = false; // Enable button
            }
        };

        // Add event listeners
        passwordInput.addEventListener('keyup', checkStrength);
        passwordInput.addEventListener('focus', checkStrength);
    </script>

    </body>
</html>
